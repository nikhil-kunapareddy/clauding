[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clauding"
version = "1.0.0"
description = "A macOS menu bar indicator for Claude Code: state, model and effort at a glance."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["claude", "claude-code", "macos", "menubar", "status"]
classifiers = [
  "Environment :: MacOS X :: Cocoa",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["pyobjc-framework-Cocoa>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/nikhil-kunapareddy/clauding"
Issues = "https://github.com/nikhil-kunapareddy/clauding/issues"

[project.scripts]
clauding = "clauding.cli:main"
clauding-hook = "clauding.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
