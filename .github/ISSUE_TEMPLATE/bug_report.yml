name: 🐛 Bug report
description: Report a bug or unexpected behaviour in clauding
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A couple of things that resolve most reports before
        they're filed:

        - `clauding status` prints what the indicator would show, without needing the
          menu bar. If that's right but the bar is wrong, say so — it narrows things a lot.
        - The [Troubleshooting guide](https://github.com/nikhil-kunapareddy/clauding/blob/main/TROUBLESHOOTING.md) covers the
          cases that fire no hook at all (interrupting with Esc, usage limits).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I've read [TROUBLESHOOTING.md](https://github.com/nikhil-kunapareddy/clauding/blob/main/TROUBLESHOOTING.md) and my issue isn't covered
          required: true
        - label: I've searched [existing issues](https://github.com/nikhil-kunapareddy/clauding/issues)
          required: true
        - label: This is one bug (please file separate reports for separate bugs)
          required: true

  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong?
      placeholder: The bar sits on "Clauding…" after the turn has clearly finished.
    validations:
      required: true

  - type: textarea
    id: what-should-happen
    attributes:
      label: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a session with `claude`
        2. Send a prompt and let it finish
        3. The bar keeps showing Clauding…
    validations:
      required: true

  - type: textarea
    id: status-output
    attributes:
      label: Output of `clauding status`
      description: Run it while the problem is happening.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: clauding version
      description: `clauding --version`
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: `python3 -V`
      placeholder: e.g. 3.12.4
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - uv tool install
        - pipx install
        - pip install (in a virtualenv)
        - Not sure
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. 15.5 (Sequoia)
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where are you running Claude Code?
      options:
        - In the terminal (CLI)
        - Claude desktop app, Code mode
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      placeholder: Other context, or say if you'd like to open a PR.
    validations:
      required: false
